      <text x="235" y="72" fill="#f1f5ff" font-size="28" font-weight="650">출시 버전</text>
      <text x="235" y="108" fill="#9aa8bf" font-size="19">Android</text>
    </g>

    <g transform="translate(580 90)">
      <rect width="440" height="170" rx="20" fill="#18243a"/>
      <rect width="8" height="170" rx="4" fill="#3e9d83"/>
      <text x="42" y="106" fill="#f1f5ff" font-size="66" font-weight="700">35</text>
      <text x="170" y="72" fill="#f1f5ff" font-size="28" font-weight="650">Target SDK</text>
      <text x="170" y="108" fill="#9aa8bf" font-size="19">Google Play 배포 설정</text>
    </g>

    <g transform="translate(1090 90)">
