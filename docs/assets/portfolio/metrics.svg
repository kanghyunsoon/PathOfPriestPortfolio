<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">사제의 길 출시와 구현 범위</title>
  <desc id="desc">출시 버전 1.1.1, Android Target SDK 35, 지원 언어 3개, 인앱 결제 상품 7개, AAB 검증 3단계</desc>
  <rect width="1600" height="520" rx="28" fill="#101a2d"/>
  <text x="70" y="58" fill="#7ec9b1" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="20" font-weight="600" letter-spacing="3">RELEASE SNAPSHOT</text>

  <g font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif">
    <g transform="translate(70 90)">
      <rect width="440" height="170" rx="20" fill="#18243a"/>
      <rect width="8" height="170" rx="4" fill="#3e9d83"/>
