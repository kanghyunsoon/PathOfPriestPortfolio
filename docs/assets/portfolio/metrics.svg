<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
  <title id="title">사제의 길 구현 범위</title>
  <desc id="desc">지원 언어 3개, 오프라인 보상 상한 2시간, 인앱 결제 등록 상품 7개. 공개한 코드 기준의 구현 수입니다.</desc>
  <rect width="1600" height="300" rx="28" fill="#101a2d"/>
  <text x="70" y="58" fill="#7ec9b1" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="22" font-weight="600">코드에서 확인할 수 있는 구현 범위</text>

  <g font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif">
    <g transform="translate(70 90)">
      <rect width="440" height="170" rx="20" fill="#18243a"/>
      <rect width="8" height="170" rx="4" fill="#3e9d83"/>
      <text x="42" y="106" fill="#f1f5ff" font-size="66" font-weight="700">3</text>
      <text x="150" y="72" fill="#f1f5ff" font-size="28" font-weight="650">지원 언어</text>
      <text x="150" y="108" fill="#9aa8bf" font-size="19">한국어 · 영어 · 일본어</text>
    </g>

    <g transform="translate(580 90)">
      <rect width="440" height="170" rx="20" fill="#18243a"/>
      <rect width="8" height="170" rx="4" fill="#3e9d83"/>
      <text x="42" y="106" fill="#f1f5ff" font-size="66" font-weight="700">2h</text>
      <text x="170" y="72" fill="#f1f5ff" font-size="28" font-weight="650">오프라인 보상</text>
      <text x="170" y="108" fill="#9aa8bf" font-size="19">미접속 시간 상한</text>
    </g>

    <g transform="translate(1090 90)">
      <rect width="440" height="170" rx="20" fill="#18243a"/>
      <rect width="8" height="170" rx="4" fill="#3e9d83"/>
      <text x="42" y="106" fill="#f1f5ff" font-size="66" font-weight="700">7</text>
      <text x="150" y="72" fill="#f1f5ff" font-size="28" font-weight="650">IAP 등록 상품</text>
      <text x="150" y="108" fill="#9aa8bf" font-size="19">소모성 6 · 광고 제거 1</text>
    </g>
  </g>
</svg>
